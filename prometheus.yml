# 5s scrape interval matches the 5s dashboard refresh required by the assignment.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Streamlit app: prometheus_client HTTP server on :8000 (separate from Streamlit's :8501)
  - job_name: caption-app
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          service: image-captioner
          env: dev

  # node_exporter: CPU / RAM / disk of the host, scraped at the same cadence for correlation
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          env: dev
# If Prometheus runs in Docker, replace localhost with host.docker.internal (Win/Mac)
# or use --network host (Linux).
